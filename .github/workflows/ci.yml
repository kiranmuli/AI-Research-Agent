name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check app research_agent tests wsgi.py config.py main.py mcp_server.py

      - name: Test
        env:
          REQUIRE_API_KEY: "true"
        run: pytest -q

      - name: Verify migrations apply
        env:
          DATABASE_URL: "sqlite:///./ci.db"
        run: alembic upgrade head

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ai-research-agent:ci .

name: Deploy

# Runs only after the CI workflow finishes successfully on main, so broken
# code never reaches the server.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Guard: only deploy when CI passed (not on a failed CI run).
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Fail the job if any command fails.
          script_stop: true
          command_timeout: 30m
          script: |
            cd ~/AI-Research-Agent
            git fetch --all
            git checkout main
            git pull --ff-only
            docker compose up -d --build
            # Recreating the web container gives it a new address; restart nginx
            # so it re-resolves the upstream and doesn't 502 after a deploy.
            docker compose restart nginx
            docker image prune -f

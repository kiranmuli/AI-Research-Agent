[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-research-agent"
version = "1.0.0"
description = "Production research agent: plan -> search -> read -> synthesize, with a pluggable LLM backend (Ollama or a cloud API)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kiran Muli" }]

dependencies = [
    # --- core agent ---
    "ddgs>=6.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "markdown>=3.5",
    "xhtml2pdf>=0.2.11",
    # --- LLM providers ---
    "ollama>=0.3.0",
    "anthropic>=0.39",
    # --- web / API ---
    "flask>=3.0",
    "gunicorn>=21.2; platform_system != 'Windows'",
    "waitress>=3.0; platform_system == 'Windows'",
    "flask-limiter>=3.5",
    # --- persistence ---
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    # --- queue / cache ---
    "redis>=5.0",
    "rq>=1.16",
    # --- config / observability ---
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
langchain = ["langchain-ollama>=0.2", "langgraph>=0.2"]
mcp = ["mcp>=1.2.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "fakeredis>=2.21",
]

[project.scripts]
research-agent = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*", "research_agent*"]

[tool.ruff]
line-length = 88
target-version = "py310"
# Alembic migrations are template-generated; the optional legacy modules predate
# this ruleset. CI lints the maintained modules explicitly (see .github/workflows).
extend-exclude = ["migrations", "langchain_agent.py", "evals.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

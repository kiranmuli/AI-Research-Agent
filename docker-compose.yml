services:
  # Ollama runs inside Docker; models live in a named volume.
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  # One-shot helper that pulls the model into Ollama on startup, then exits.
  model-pull:
    image: ollama/ollama
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "sleep 3 && ollama pull ${OLLAMA_MODEL:-llama3.2}"]
    restart: "no"

  # The research agent web UI, talking to the Ollama service above.
  research-agent:
    build: .
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
    ports:
      - "5000:5000"
    restart: unless-stopped

volumes:
  ollama_models:

services:
  research-agent:
    build: .
    ports:
      - "5000:5000"
    environment:
      # Reach the Ollama server running on the host machine.
      - OLLAMA_HOST=http://host.docker.internal:11434
    # Makes host.docker.internal resolve on Linux too (no effect on Desktop).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

upstream research_web {
    server web:5000;
}

server {
    listen 80;
    server_name _;

    # Cap upload size to match the app's own limit.
    client_max_body_size 1m;

    # Static/UI and API.
    location / {
        proxy_pass http://research_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Server-Sent Events endpoints: disable buffering and allow long-lived,
    # quiet connections while the model works.
    location ~ ^/(research$|api/v1/research/.*/stream$) {
        proxy_pass http://research_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
